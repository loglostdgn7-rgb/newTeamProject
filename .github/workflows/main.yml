# .github/workflows/deploy.yml

name: Deploy Spring Boot to OCI

on:
  push:
    branches:
      - Youngsoo-deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # (수정됨) mvnw 파일에 실행 권한 부여
      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/new-team-project:latest
          platforms: linux/amd64,linux/arm64

  deploy-to-oci:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.HOST_SSH_KEY }}
          known_hosts: 'just-a-placeholder'

      - name: Deploy to OCI
        run: |
          export SSH_OPTS="-o StrictHostKeyChecking=no"
          
          ssh $SSH_OPTS ${{ secrets.HOST_USERNAME }}@${{ secrets.HOST_IP }} << 'EOF'
          
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/new-team-project:latest
          
            docker stop shopping-mall || true
            docker rm shopping-mall || true
          
            docker run -d \
              -p 80:8080 \
              --name shopping-mall \
              --restart always \
              -e SPRING_DATASOURCE_URL=${{ secrets.DB_URL }} \
              -e SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USER }} \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASS }} \
              -e KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }} \
              -e KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }} \
              -e NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }} \
              -e NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }} \
              -e PORTONE_API_KEY=${{ secrets.PORTONE_API_KEY }} \
              -e PORTONE_SECRET=${{ secrets.PORTONE_SECRET }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/new-team-project:latest
          
          EOF