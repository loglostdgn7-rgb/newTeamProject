# .github/workflows/deploy.yml

name: Deploy Spring Boot to OCI

# 1. 언제 실행할 것인가 (Youngsoo-deploy 브랜치에 push가 일어나면)
on:
  push:
    branches:
      - Youngsoo-deploy

jobs:
  # 2. 첫 번째 잡: 빌드 및 도커 이미지 푸시
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # (1) 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # (2) JDK 21 설치 (수정됨)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # (3) Maven 캐시 설정 (빌드 속도 향상!)
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # (4) Maven으로 빌드 (JAR 파일 생성)
      - name: Build with Maven
        run: ./mvnw package -DskipTests

      # (5) Docker Hub 로그인 (Secrets 사용)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # (6) 도커 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # (중요) 본인 Docker Hub ID로 수정하세요 (예: kimyoungsoo/new-team-project)
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/loglost/new-team-project:latest

  # 3. 두 번째 잡: OCI 서버에 배포
  deploy-to-oci:
    # (중요) 'build-and-push' 잡이 성공해야만 실행됨
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # (1) SSH 키 설치 (OCI 접속용)
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.HOST_SSH_KEY }}
          known_hosts: 'just-a-placeholder' # 임시값, 아래서 처리

      # (2) SSH 접속 및 배포 명령 실행
      - name: Deploy to OCI
        run: |
          # known_hosts 보안 검사 비활성화 (최초 접속 허용)
          export SSH_OPTS="-o StrictHostKeyChecking=no"
          
          # SSH 접속 및 배포 스크립트 실행
          ssh $SSH_OPTS ${{ secrets.HOST_USERNAME }}@${{ secrets.HOST_IP }} << 'EOF'
          
            # 1. Docker Hub에서 새 이미지 받아오기
            docker pull ${{ secrets.DOCKER_USERNAME }}/new-team-project:latest
          
            # 2. 기존에 돌아가던 컨테이너 중지 및 삭제 (있으면)
            docker stop shopping-mall || true
            docker rm shopping-mall || true
          
            # 3. 새 이미지로 컨테이너 실행
            # (중요) 80번 포트를 8080으로 연결, DB 정보를 환경변수로 주입
            docker run -d \
              -p 80:8080 \
              --name shopping-mall \
              --restart always \
              -e SPRING_DATASOURCE_URL=${{ secrets.DB_URL }} \
              -e SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USER }} \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASS }} \
              ${{ secrets.DOCKER_USERNAME }}/new-team-project:latest
          
          EOF